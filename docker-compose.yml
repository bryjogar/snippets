services:
  mongo:
    image: mongo:7
    container_name: snippets-mongo
    restart: unless-stopped
    volumes:
      - snippets-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10

  snippets:
    build: .
    container_name: snippets
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${PORT:-3008}:${PORT:-3008}"
    environment:
      - PORT=${PORT:-3008}
      - AUTH_TOKEN=${AUTH_TOKEN}
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=snippets

volumes:
  snippets-mongo-data:


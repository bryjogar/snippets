<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="description" content="Cross-device code snippet library">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Snippets">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Fira+Code:wght@400;500&family=Inter:ital,opsz,wght@0,14..32,400..600;1,14..32,400..600&display=swap" rel="stylesheet">
  <title>Snippets</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #161822;
      --surface-hover: #1e2130;
      --surface-raised: #1c1f2e;
      --border: #2a2d3a;
      --border-subtle: #222433;
      --text: #d6dae2;
      --text2: #959bb0;
      --text3: #6b7085;
      --accent: #60a5fa;
      --accent2: #818cf8;
      --accent-ghost: rgba(96, 165, 250, 0.12);
      --green: #4ade80;
      --red: #f87171;
      --radius: 6px;
      --radius-lg: 10px;
      --font-display: 'DM Serif Display', Georgia, serif;
      --font-body: 'Inter', 'SF Pro Text', system-ui, sans-serif;
      --font-mono: 'Fira Code', 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace;
      --shadow: 0 2px 12px rgba(0,0,0,0.5);
    }

    :root.light {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-hover: #f4f4f5;
      --surface-raised: #ffffff;
      --border: #e4e4e7;
      --border-subtle: #eaeaee;
      --text: #18181b;
      --text2: #52525b;
      --text3: #a1a1aa;
      --accent: #2563eb;
      --accent2: #4f46e5;
      --accent-ghost: rgba(37, 99, 235, 0.08);
      --green: #16a34a;
      --red: #dc2626;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      font-size: 17px; font-weight: 400; line-height: 1.5;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    #app { display: flex; height: 100%; overflow: hidden; }

    button {
      font-family: var(--font-body); cursor: pointer;
      border: none; background: none; color: inherit; font-size: inherit;
    }

    input, textarea, select {
      font-family: var(--font-body); font-size: 16px;
      color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 14px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ghost);
    }

    a { color: var(--accent2); text-decoration: none; }
    a:hover { text-decoration: underline; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    ::selection { background: var(--accent-ghost); color: var(--text); }

    /* ── RESPONSIVE LAYOUT SHELL ── */
    .layout { display: flex; width: 100%; height: 100%; }

    .sidebar {
      width: 200px; min-width: 200px;
      background: var(--surface);
      border-right: 1px solid var(--border-subtle);
      display: flex; flex-direction: column;
      overflow-y: auto; z-index: 10;
    }

    .main {
      flex: 1; display: flex; flex-direction: column;
      min-width: 0; overflow: hidden; position: relative;
    }

    .header {
      height: 48px; min-height: 48px;
      display: flex; align-items: center; padding: 0 16px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg); gap: 12px; z-index: 2;
    }

    .header-title {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 600; font-style: italic;
      white-space: nowrap;
    }

    .content { flex: 1; overflow-y: auto; padding: 24px 32px; }

    .bottom-nav {
      display: flex; border-top: 1px solid var(--border-subtle);
      background: var(--surface);
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    }

    @media (max-width: 767px) {
      .layout > .sidebar {
        position: fixed; left: 0; top: 0; bottom: 0;
        transform: translateX(-100%);
        transition: transform 250ms ease;
      }
      .layout > .sidebar.open { transform: translateX(0); }
      .sidebar-overlay {
        position: fixed; inset: 0;
        background: rgba(0, 0, 0, 0.45); z-index: 9;
      }
      .content { padding: 16px 12px 80px; }
      .header { padding: 0 12px; }
    }

    @media (min-width: 768px) {
      .hamburger { display: none; }
      .bottom-nav { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // ── Web Share Target handler ──
    // SPA fallback serves /share from index.html — capture shared data before app boots
    (function() {
      if (location.pathname === '/share') {
        var params = new URLSearchParams(location.search);
        var stash = {};
        if (params.get('title')) stash.title = params.get('title');
        if (params.get('text')) stash.text = params.get('text');
        if (params.get('url')) stash.url = params.get('url');
        window.__shareData = stash;
        // Clean URL — navigate to /new
        history.replaceState(null, '', '/#/new');
      }
    })();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      }).then(function() {
        navigator.serviceWorker.register('/sw.js?v=BUILD_ID', { scope: '/' });
      });
    }
  </script>
  <script type="module" src="/app.js?v=BUILD_ID"></script>
</body>
</html>
